<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نظام نقاط المنافسة</title>
<style>
:root{--bg:#04192b;--side:#031a2c;--card:#072a41;--card2:#0a3550;--line:rgba(120,190,230,.2);--text:#fff;--muted:#9fb6c8;--orange:#ff5f2e;--teal:#16c7d8}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button,input,select,textarea{font:inherit}
.app{display:grid;grid-template-columns:330px minmax(0,1fr) 230px;grid-template-areas:"right center left";min-height:100vh}
.right{grid-area:right;background:var(--bg);padding:14px;display:flex;flex-direction:column;gap:14px;border-inline-end:1px solid var(--line)}
.center{grid-area:center;min-width:0;padding:0 0 14px}
.left{grid-area:left;background:var(--side);border-inline-start:1px solid var(--line);display:flex;flex-direction:column;position:relative;overflow:hidden}
.logoBox{cursor:pointer;display:flex;justify-content:center;align-items:center}
.logoBox img{max-width:100%;display:block}
.left .logoBox{padding:22px 40px 14px}
.right .logoBox{padding:6px 24px}
nav.menu{display:flex;flex-direction:column;gap:8px;padding:10px 12px;z-index:2}
nav.menu button{display:flex;align-items:center;gap:12px;padding:13px 14px;border:0;border-radius:12px;background:transparent;color:#fff;cursor:pointer;text-align:start;font-size:1rem}
nav.menu button .i{width:28px;text-align:center;font-size:1.15rem}
nav.menu button.on{background:var(--orange);font-weight:bold}
nav.menu button:not(.on):hover{background:rgba(255,255,255,.07)}
.leftArt{position:absolute;bottom:0;left:0;right:0;height:240px;pointer-events:none;opacity:.9}
/* hero */
.hero{position:relative;height:230px;overflow:hidden;background:linear-gradient(100deg,#0a3d63,#052b47 55%,#04192b)}
.hero>svg{position:absolute;inset:0;width:100%;height:100%}
.hero .txt{position:absolute;inset-inline-start:34px;top:50%;transform:translateY(-50%);z-index:2;max-width:55%}
.hero h1{margin:0;font-size:2.4rem;display:flex;align-items:center;gap:14px;cursor:pointer}
.hero p{margin:10px 0 0;font-size:1.25rem;color:#c5d6e4;cursor:pointer}
.hero .tag{position:absolute;inset-inline-end:26px;bottom:34px;z-index:2;font-size:2rem;font-weight:800;color:#2fd0c8;transform:rotate(-8deg);line-height:1.15;text-align:center;text-shadow:0 2px 6px rgba(0,0,0,.4)}
.pad{padding:14px 14px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;padding:14px}
.gc{--c:#ff5f2e;position:relative;border-radius:16px;padding:14px;min-height:320px;overflow:hidden;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 22%,#041a2c),#041a2c 80%)}
.gc .hd{display:flex;align-items:center;gap:10px;position:relative;z-index:2}
.gc .hd b{font-size:1.05rem}
.badge{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem;background:#8b98a5;color:#fff;flex:none}
.b1{background:#f5b800;color:#2b2000}.b2{background:#c9d1d8;color:#222}.b3{background:#f06a2a}.b4{background:#8b98a5}
.gc svg.fl{position:absolute;left:0;right:0;top:44px;width:100%;height:150px}
.gc .pts{position:absolute;inset-inline:14px;top:178px;z-index:2;text-align:end}
.gc .pts big{display:block;font-size:2.6rem;font-weight:800;line-height:1}
.gc .pts span{font-size:.9rem;color:#d4e1ec}
.gc .bar{position:absolute;inset-inline:14px;bottom:44px;height:12px;border-radius:8px;background:rgba(255,255,255,.18);overflow:hidden;z-index:2}
.gc .bar i{display:block;height:100%;border-radius:8px;background:var(--c);margin-inline-start:auto}
.gc .ft{position:absolute;inset-inline:14px;bottom:12px;display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:#d4e1ec;z-index:2}
.gc .ft b{color:var(--c);font-size:1.1rem;filter:brightness(1.25)}
/* panels */
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.panel h2{margin:0 0 12px;font-size:1.15rem;display:flex;align-items:center;gap:10px}
.panel h2 .ic{width:34px;height:34px;border-radius:50%;background:#12b7a8;display:flex;align-items:center;justify-content:center;font-size:1.1rem}
.panel h2 .more{margin-inline-start:auto;font-size:.8rem;font-weight:normal;color:#fff;background:none;border:1px solid var(--line);border-radius:10px;padding:6px 14px;cursor:pointer}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px;padding:0 14px}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{color:#cfe0ee;font-weight:600;text-align:start;padding:8px 6px;background:rgba(255,255,255,.05)}
td{padding:9px 6px;border-bottom:1px solid rgba(255,255,255,.07)}
tr:last-child td{border:0}
.pl{color:#38d27a;font-weight:700;direction:ltr;text-align:end;display:inline-block}.mi{color:#ff6b6b;font-weight:700;direction:ltr;display:inline-block}
.pill{display:inline-flex;align-items:center;gap:6px}
.flag{display:inline-block;width:14px;height:14px;border-radius:3px 7px 3px 7px;background:var(--c)}
.rk{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#32566f;font-weight:700;font-size:.8rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;padding:12px 14px 0}
.tile{display:flex;align-items:center;gap:14px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;color:#fff;cursor:pointer;text-align:start}
.tile .ti{font-size:2rem;width:52px;text-align:center;flex:none}
.tile b{display:block}.tile small{color:var(--muted)}
.tile .ar{margin-inline-start:auto;font-size:1.3rem;color:var(--muted)}
/* forms */
label{display:block;font-size:.9rem;margin:12px 0 6px}
input,select,textarea{width:100%;padding:12px;border:0;border-radius:10px;background:#fff;color:#223;font-size:.95rem}
input::placeholder{color:#8a97a3}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:14px 8px;border:0;border-radius:10px;background:#0b3550;color:#fff;cursor:pointer;font-size:1rem}
.seg button.on{background:var(--orange);font-weight:bold}
.btn{border:0;border-radius:10px;padding:13px 16px;background:var(--orange);color:#fff;cursor:pointer;font-weight:bold}
.btn.gray{background:#12405d}.btn.red{background:#c73a3a}.btn.full{width:100%}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>.btn{flex:none}
.chips{display:flex;gap:6px;margin-top:6px}.chips button{flex:1;padding:8px;border:1px solid var(--line);background:transparent;color:#fff;border-radius:8px;cursor:pointer}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.item:last-child{border:0}.item .nm{flex:1}.item small{color:var(--muted)}
.ico{border:0;background:none;color:#fff;font-size:1.1rem;cursor:pointer;padding:4px}
.empty{text-align:center;color:var(--muted);padding:18px}
.view{padding:14px;display:flex;flex-direction:column;gap:12px}
.chk{display:flex;gap:10px;align-items:center;margin-top:12px}.chk input{width:auto}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:10px 20px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
:root{color-scheme:dark}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.dlg{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:18px;width:100%;max-width:380px}
.dlg h3{margin:0 0 6px;font-size:1.1rem}.dlg textarea{min-height:120px;direction:ltr;font-size:.75rem}
.dlg .row{margin-top:16px}
@media(max-width:1100px){
 .app{grid-template-columns:1fr;grid-template-areas:"left" "center" "right"}
 .left{flex-direction:row;align-items:center;overflow-x:auto;border:0;border-bottom:1px solid var(--line)}
 .left .logoBox{padding:8px 14px;flex:none}.left .logoBox img{height:64px;width:auto}
 .leftArt{display:none}
 nav.menu{flex-direction:row;padding:8px}nav.menu button{white-space:nowrap;padding:10px 12px}
 .right{border:0}.right .logoBox img{max-height:90px}
 .two{grid-template-columns:1fr}
 .hero{height:200px}.hero h1{font-size:1.6rem}.hero p{font-size:1rem}.hero .tag{font-size:1.3rem}
 .hero .txt{max-width:70%;inset-inline-start:16px}
}
</style>
</head>

<div class="app">
  <aside class="right">
    <div class="logoBox" id="logoR" title="اضغط لتغيير الشعار"></div>

  </aside>

    <div class="hero" id="hero">
      <svg viewBox="0 0 1000 230" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <linearGradient id="sky" x1="0" x2="1"><stop offset="0" stop-color="#1b86b8"/><stop offset=".5" stop-color="#0a4570"/><stop offset="1" stop-color="#04192b"/></linearGradient>
          <radialGradient id="sun"><stop offset="0" stop-color="#ff8a3d"/><stop offset="1" stop-color="#ff4d1c"/></radialGradient>

        <path d="M310 4 C330 -2 345 12 365 6 L365 26 C345 32 330 18 310 24Z" fill="#031a2c"/>
        <path d="M338 46 l6 -4 l4 8 l8 -2 l-4 14 l5 10 l-8 0 l-3 -10 l-6 4 l-3 12 l-8 0 l5 -18 z" fill="#031a2c"/>
        <circle cx="344" cy="40" r="6" fill="#031a2c"/>
      </svg>
      <div class="txt"><h1 id="hTitle"></h1><p id="hSub"></p></div>
      <div class="tag" id="hTag"></div>
    </div>
    <div id="page"></div>
  </section>
  <aside class="left">
    <div class="logoBox" id="logoL" title="اضغط لتغيير الشعار"></div>
    <nav class="menu" id="menu"></nav>
    <svg class="leftArt" viewBox="0 0 230 240" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 240 L0 130 L70 190 L110 120 L230 240Z" fill="#ff5f2e" opacity=".85"/>
      <path d="M0 240 L0 170 L50 210 L90 150 L190 240Z" fill="#0d3a5e"/>
      <path d="M0 240 L0 205 L40 240Z" fill="#07213a"/>
    </svg>
  </aside>
</div>
<input type="file" id="file" accept="image/*" hidden>
<div class="toast" id="toast"></div>

const KEY='points-app-v2';
const PAL=['#ff5a2a','#16c7d8','#f5a623','#1e7bff','#9b5cf6','#2fd27a','#ec4899','#a3c921'];
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>Number(n).toLocaleString('en');
const fresh=()=>({title:'نظام نقاط المنافسة',sub:'تحديات اليوم .. تصنع أبطال الغد',tag:'هنا تصنع\nالتميز',goal:1200,countToGroup:true,logoR:'',logoL:'',supervisor:'',
  groups:[],people:[],log:[]});
let S=fresh();
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(fresh(),JSON.parse(r))}catch(e){}

const $=s=>document.querySelector(s);
const grp=id=>S.groups.find(g=>g.id===id), per=id=>S.people.find(p=>p.id===id);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1900)}
/* نوافذ داخل الصفحة بدل prompt/confirm (المتصفح المضمّن لا يعرضها) */
function dlg(title,fields,okText,onOk,danger){
  const o=document.createElement('div');o.className='ov';
  o.innerHTML=`<div class="dlg"><h3>${esc(title)}</h3>${fields.map((f,i)=>f.area?`<label>${esc(f.label)}</label><textarea id="dq${i}" ${f.readonly?'readonly':''}>${esc(f.value||'')}</textarea>`:`<label>${esc(f.label)}</label><input id="dq${i}" type="${f.type||'text'}" value="${esc(f.value??'')}">`).join('')}
  <div class="row"><button class="btn ${danger?'red':''}" id="dok">${esc(okText)}</button><button class="btn gray" id="dno">إلغاء</button></div></div>`;
  document.body.appendChild(o);const first=o.querySelector('input,textarea');first&&first.focus();
  const close=()=>o.remove();
  o.querySelector('#dno').onclick=close;o.onclick=e=>{if(e.target===o)close()};
  o.querySelector('#dok').onclick=()=>{const v=fields.map((f,i)=>o.querySelector('#dq'+i).value);close();onOk&&onOk(v)};
  o.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT')o.querySelector('#dok').click();if(e.key==='Escape')close()});
}
const sure=(msg,okText,onOk)=>dlg(msg,[],okText,onOk,true);
const fmt=t=>{const d=new Date(t),p=n=>String(n).padStart(2,'0');return`${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`};

function totals(){
  const g={},p={};S.groups.forEach(x=>g[x.id]=0);S.people.forEach(x=>p[x.id]=0);
  S.log.forEach(e=>{
    if(e.type==='person'){if(e.personId in p)p[e.personId]+=e.points;if(S.countToGroup&&e.groupId in g)g[e.groupId]+=e.points}
    else if(e.groupId in g)g[e.groupId]+=e.points;
  });return{g,p};
}
const sortedGroups=t=>[...S.groups].sort((a,b)=>t.g[b.id]-t.g[a.id]);
const sortedPeople=t=>[...S.people].sort((a,b)=>t.p[b.id]-t.p[a.id]);

function paintFrame(){
  $('#logoR').innerHTML=`<img src="${S.logoR||LOGO_NAFIS}" alt="شعار">`;
  $('#logoL').innerHTML=`<img src="${S.logoL||LOGO_HABKA}" alt="شعار">`;
  $('#hTitle').innerHTML=`<svg width="40" height="40" viewBox="0 0 40 40"><rect x="2" y="20" width="9" height="18" rx="2" fill="#ff7a3d"/><rect x="15" y="8" width="9" height="30" rx="2" fill="#ff7a3d"/><rect x="28" y="2" width="9" height="36" rx="2" fill="#ff7a3d"/></svg>${esc(S.title)}`;
  $('#hSub').textContent=S.sub;
  $('#hTag').innerHTML=esc(S.tag).replace(/\n/g,'<br>');
  document.title=S.title;
}
let pendingLogo;
['logoR','logoL'].forEach(k=>$('#'+k).onclick=()=>{pendingLogo=k;$('#file').click()});
$('#file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{const img=new Image();img.onload=()=>{
    const s=Math.min(1,500/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    S[pendingLogo]=c.toDataURL('image/png');save();paintFrame()};img.src=rd.result};
  rd.readAsDataURL(f);e.target.value='';
};

/* ---------- القائمة ---------- */
const NAV=[['home','🏠','الرئيسية'],['groups','👥','المجموعات'],['people','🎓','الطلاب'],['add','➕','إضافة النقاط'],['log','📄','سجل العمليات'],['rank','📊','الترتيب'],['settings','⚙️','الإعدادات']];
let page='home';
function paintMenu(){
  $('#menu').innerHTML=NAV.map(([k,i,t])=>`<button data-k="${k}" class="${k===page?'on':''}"><span class="i">${i}</span>${t}</button>`).join('');
}
$('#menu').onclick=e=>{const b=e.target.closest('button');if(!b)return;go(b.dataset.k)};
function go(k){
  if(k==='add'){$('#addPanel').scrollIntoView({behavior:'smooth',block:'start'});const f=$('#fpts');f&&f.focus({preventScroll:true});return}
  page=k;paintMenu();render();
}

/* ---------- لوحة إضافة النقاط (دائمة) ---------- */
let addType='person',selGroup='';
function paintAdd(){
  if(!S.groups.some(g=>g.id===selGroup))selGroup=S.groups[0]?.id||'';
  const members=S.people.filter(p=>p.groupId===selGroup);
  const lastC=[...new Set(S.log.map(e=>e.contest).filter(Boolean))];
  $('#addPanel').innerHTML=`<h2><span class="ic">+</span>إضافة نقاط جديدة</h2>
  <label>نوع المسابقة</label>
  <div class="seg"><button data-ty="group" class="${addType==='group'?'on':''}">👥 جماعية</button><button data-ty="person" class="${addType==='person'?'on':''}">👤 فردية</button></div>
  <label>المجموعة</label>
  <select id="fg">${S.groups.length?S.groups.map(g=>`<option value="${g.id}" ${g.id===selGroup?'selected':''}>${esc(g.name)}</option>`).join(''):'<option value="">أضف مجموعة أولًا</option>'}</select>
  <label>الطالب</label>
  <select id="fp" ${addType==='group'?'disabled':''}>${members.length?members.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join(''):'<option value="">'+(addType==='group'?'—':'لا يوجد طلاب في المجموعة')+'</option>'}</select>
  <label>المسابقة / النشاط</label>
  <input id="fc" list="cl" placeholder="مثال: تحدي الذاكرة"><datalist id="cl">${lastC.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
  <label>النقاط</label>
  <input id="fpts" type="number" inputmode="numeric" placeholder="أدخل عدد النقاط (سالب للخصم)">
  <div class="chips">${[10,50,100,-10].map(v=>`<button data-q="${v}">${v>0?'+':''}${v}</button>`).join('')}</div>
  <button class="btn full" id="go" style="margin-top:14px">➕ إضافة النقاط</button>`;
  document.querySelectorAll('#addPanel [data-ty]').forEach(b=>b.onclick=()=>{addType=b.dataset.ty;paintAdd()});
  $('#fg').onchange=e=>{selGroup=e.target.value;paintAdd()};
  document.querySelectorAll('#addPanel [data-q]').forEach(b=>b.onclick=()=>{$('#fpts').value=(+$('#fpts').value||0)+(+b.dataset.q)});
  $('#go').onclick=()=>{
    const pts=parseInt($('#fpts').value);
    if(!selGroup){toast('اختر المجموعة');return}
    if(!pts){toast('اكتب عدد النقاط');return}
    const e={id:uid(),time:Date.now(),type:addType,contest:$('#fc').value.trim(),points:pts,by:S.supervisor,groupId:selGroup,groupName:grp(selGroup).name};
    if(addType==='person'){const p=per($('#fp').value);if(!p){toast('اختر الطالب');return}e.personId=p.id;e.name=p.name}
    else e.name=grp(selGroup).name;
    S.log.unshift(e);save();toast('تمت إضافة النقاط ✓');paintAdd();render();
  };
}

/* ---------- عناصر مشتركة ---------- */
function flagSvg(c){return`<svg class="fl" viewBox="0 0 200 150" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
 <defs><linearGradient id="m${c.slice(1)}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".55"/><stop offset="1" stop-color="#041a2c"/></linearGradient></defs>
 <path d="M10 150 L85 62 L110 90 L140 50 L195 150Z" fill="url(#m${c.slice(1)})"/>
 <path d="M85 62 L70 150 L130 150 L110 90Z" fill="#000" opacity=".25"/>
 <line x1="88" y1="62" x2="92" y2="4" stroke="#12263a" stroke-width="3"/>
 <path d="M92 6 C112 -2 132 16 160 8 L148 32 L156 52 C132 60 112 42 90 52Z" fill="${c}"/>
</svg>`}
const flagDot=c=>`<span class="flag" style="--c:${c}"></span>`;
const typeTxt=e=>e.type==='person'?'👤 فردية':'👥 جماعية';
const who=e=>e.type==='person'?`${esc(e.name)} (${esc((grp(e.groupId)||{}).name||e.groupName||'')})`:esc(e.name);
const pts=n=>`<span class="${n>0?'pl':'mi'}">${n>0?'+ ':'- '}${Math.abs(n)}</span>`;

function groupCards(){
  const t=totals(),gs=sortedGroups(t);
  if(!gs.length)return'<div class="empty">أضف مجموعات من صفحة «المجموعات»</div>';
  return`<div class="cards">${gs.map((g,i)=>{const v=t.g[g.id],pc=Math.max(0,Math.min(100,Math.round(v/S.goal*100)));
    return`<div class="gc" style="--c:${g.color}"><div class="hd"><span class="badge b${Math.min(i+1,4)}">${i+1}</span><b>${esc(g.name)}</b></div>
    ${flagSvg(g.color)}<div class="pts"><big>${num(v)}</big><span>نقطة</span></div>
    <div class="bar"><i style="width:${pc}%"></i></div>
    <div class="ft"><span>من ${num(S.goal)} نقطة</span><b>${pc}%</b></div></div>`}).join('')}</div>`;
}
function recentTable(n){
  const rows=S.log.slice(0,n);
  return rows.length?`<table><tr><th>#</th><th>الوقت والتاريخ</th><th>الطالب / المجموعة</th><th>نوع النقاط</th><th>المسابقة</th><th>النقاط</th></tr>
  ${rows.map((e,i)=>`<tr><td>${i+1}</td><td>${fmt(e.time)}</td><td>${who(e)}</td><td>${typeTxt(e)}</td><td>${esc(e.contest||'—')}</td><td>${pts(e.points)}</td></tr>`).join('')}</table>`:'<div class="empty">لا توجد عمليات بعد</div>';
}
function peopleTable(n){
  const t=totals(),ps=sortedPeople(t).slice(0,n);
  return ps.length?`<table><tr><th>#</th><th>الطالب</th><th>المجموعة</th><th>النقاط</th></tr>
  ${ps.map((p,i)=>{const g=grp(p.groupId)||{color:'#888',name:'—'};return`<tr><td><span class="rk" style="${i===0?'background:#f5b800;color:#2b2000':''}">${i+1}</span></td><td>${esc(p.name)}</td><td><span class="pill" style="--c:${g.color}">${flagDot(g.color)}${esc(g.name.replace('مجموعة ',''))}</span></td><td style="color:#38d27a;font-weight:700">${num(t.p[p.id])}</td></tr>`}).join('')}</table>`:'<div class="empty">أضف طلابًا من صفحة «الطلاب»</div>';
}

/* ---------- الصفحات ---------- */
function render(){({home:vHome,groups:vGroups,people:vPeople,log:vLog,rank:vRank,settings:vSettings})[page]()}

function vHome(){
  $('#page').innerHTML=`${groupCards()}
  <div class="two"><div class="panel"><h2><span class="ic" style="background:none;border:2px solid #fff">🕒</span>آخر العمليات<button class="more" data-go="log">عرض الكل</button></h2>${recentTable(5)}</div>
  <div class="panel"><h2><span class="ic" style="background:none">👤</span>ترتيب الأفراد<button class="more" data-go="rank">عرض الكل</button></h2>${peopleTable(5)}</div></div>
  <div class="tiles">
   <button class="tile" data-go="log"><span class="ti">📄</span><span><b>سجل العمليات</b><small>عرض وتعديل جميع العمليات</small></span><span class="ar">‹</span></button>
   <button class="tile" data-go="people"><span class="ti">🎓</span><span><b>إدارة الطلاب</b><small>إضافة الطلاب وتوزيعهم على المجموعات</small></span><span class="ar">‹</span></button>
   <button class="tile" data-go="groups"><span class="ti">👥</span><span><b>إدارة المجموعات</b><small>إضافة وتعديل المجموعات</small></span><span class="ar">‹</span></button></div>`;
  bindGo();
}
const bindGo=()=>document.querySelectorAll('#page [data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));

function vRank(){
  $('#page').innerHTML=`${groupCards()}<div class="two" style="grid-template-columns:1fr"><div class="panel"><h2>👤 ترتيب الأفراد</h2>${peopleTable(1000)}</div></div>`;
}

function vGroups(){
  $('#page').innerHTML=`<div class="view"><div class="panel"><h2>👥 إدارة المجموعات</h2>
  <div class="row"><input id="ng" placeholder="اسم مجموعة جديدة"><button class="btn" id="addg">إضافة</button></div>
  <div style="margin-top:8px">${S.groups.map(g=>`<div class="item"><span class="flag" style="--c:${g.color};width:20px;height:20px"></span><div class="nm">${esc(g.name)}<br><small>${S.people.filter(p=>p.groupId===g.id).length} طالب</small></div>
   <input type="color" value="${g.color}" data-col="${g.id}" style="width:44px;padding:2px;height:38px"><button class="ico" data-rg="${g.id}">✏️</button><button class="ico" data-dg="${g.id}">🗑️</button></div>`).join('')||'<div class="empty">لا توجد مجموعات</div>'}</div></div></div>`;
  $('#addg').onclick=()=>{const n=$('#ng').value.trim();if(!n)return;S.groups.push({id:uid(),name:n,color:PAL[S.groups.length%PAL.length]});save();vGroups();paintAdd()};
  $('#ng').onkeydown=e=>{if(e.key==='Enter')$('#addg').click()};
  document.querySelectorAll('[data-col]').forEach(i=>i.onchange=()=>{grp(i.dataset.col).color=i.value;save();vGroups()});
  document.querySelectorAll('[data-rg]').forEach(b=>b.onclick=()=>{const g=grp(b.dataset.rg);
    dlg('تعديل المجموعة',[{label:'اسم المجموعة',value:g.name}],'حفظ',([n])=>{if(n.trim()){g.name=n.trim();save();vGroups();paintAdd()}})});
  document.querySelectorAll('[data-dg]').forEach(b=>b.onclick=()=>{const g=grp(b.dataset.dg);
    if(S.people.some(p=>p.groupId===g.id)){toast('انقل أو احذف طلاب المجموعة أولًا');return}
    sure('حذف «'+g.name+'»؟ تبقى عملياتها في السجل.','حذف',()=>{S.groups=S.groups.filter(x=>x!==g);save();vGroups();paintAdd()})});
}

function vPeople(){
  const opts=sel=>S.groups.map(g=>`<option value="${g.id}" ${g.id===sel?'selected':''}>${esc(g.name)}</option>`).join('');
  $('#page').innerHTML=`<div class="view"><div class="panel"><h2>🎓 إدارة الطلاب</h2>
  <label style="margin-top:0">أضف عدة أسماء دفعة واحدة (كل اسم في سطر)</label>
  <textarea id="np" rows="3" placeholder="أحمد&#10;خالد"></textarea>
  <select id="npg" style="margin-top:8px">${opts()}</select>
  <button class="btn full" id="addp" style="margin-top:8px">إضافة الطلاب</button></div>
  <div class="panel">${S.people.map(p=>`<div class="item"><div class="nm">${esc(p.name)}</div>
   <select data-mv="${p.id}" style="width:auto;padding:8px">${opts(p.groupId)}</select><button class="ico" data-rp="${p.id}">✏️</button><button class="ico" data-dp="${p.id}">🗑️</button></div>`).join('')||'<div class="empty">لا يوجد طلاب</div>'}</div></div>`;
  $('#addp').onclick=()=>{
    if(!S.groups.length){toast('أضف مجموعة أولًا');return}
    const names=$('#np').value.split('\n').map(s=>s.trim()).filter(Boolean);if(!names.length)return;
    names.forEach(n=>S.people.push({id:uid(),name:n,groupId:$('#npg').value}));save();vPeople();paintAdd()};
  document.querySelectorAll('[data-mv]').forEach(s=>s.onchange=()=>{per(s.dataset.mv).groupId=s.value;save();paintAdd();toast('تم النقل')});
  document.querySelectorAll('[data-rp]').forEach(b=>b.onclick=()=>{const p=per(b.dataset.rp);
    dlg('تعديل الطالب',[{label:'اسم الطالب',value:p.name}],'حفظ',([n])=>{if(n.trim()){p.name=n.trim();save();vPeople();paintAdd()}})});
  document.querySelectorAll('[data-dp]').forEach(b=>b.onclick=()=>{const p=per(b.dataset.dp);
    sure('حذف «'+p.name+'»؟','حذف',()=>{S.people=S.people.filter(x=>x!==p);save();vPeople();paintAdd()})});
}

function vLog(){
  $('#page').innerHTML=`<div class="view"><div class="panel"><h2>📄 سجل العمليات</h2>${S.log.length?S.log.map(e=>`
  <div class="item"><div class="nm">${e.type==='person'?'👤':'👥'} ${who(e)}<br><small>${e.type==='person'?'فردية':'جماعية'}${e.contest?' • '+esc(e.contest):''}${e.by?' • '+esc(e.by):''} • ${fmt(e.time)}</small></div>
  ${pts(e.points)}<button class="ico" data-e="${e.id}">✏️</button><button class="ico" data-d="${e.id}">🗑️</button></div>`).join(''):'<div class="empty">لا توجد عمليات بعد</div>'}</div></div>`;
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>sure('حذف هذه العملية؟','حذف',()=>{S.log=S.log.filter(x=>x.id!==b.dataset.d);save();vLog();paintAdd()}));
  document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{const e=S.log.find(x=>x.id===b.dataset.e);
    dlg('تعديل العملية',[{label:'النقاط',value:e.points,type:'number'},{label:'المسابقة / النشاط',value:e.contest||''}],'حفظ',([p,c])=>{
      const n=parseInt(p);if(!n){toast('رقم غير صالح');return}e.points=n;e.contest=c.trim();save();vLog()})});
}

function vSettings(){
  $('#page').innerHTML=`<div class="view"><div class="panel"><h2>⚙️ الإعدادات</h2>
  <label style="margin-top:0">عنوان البرنامج</label><input id="st" value="${esc(S.title)}">
  <label>العبارة تحت العنوان</label><input id="ss" value="${esc(S.sub)}">
  <label>العبارة المائلة على الصورة (سطرين: اضغط Enter)</label><textarea id="sg" rows="2">${esc(S.tag)}</textarea>
  <label>هدف المنافسة (نقطة)</label><input id="sgl" type="number" value="${S.goal}">
  <label>اسم المشرف (يظهر في السجل)</label><input id="sv" value="${esc(S.supervisor)}">
  <div class="chk"><input type="checkbox" id="ctg" ${S.countToGroup?'checked':''}><span>نقاط الأفراد تُحسب أيضًا لمجموعتهم</span></div>
  <button class="btn full" id="sv_save" style="margin-top:14px">حفظ</button></div>
  <div class="panel"><h2>البيانات والشعارات</h2><div class="row" style="flex-wrap:wrap">
  <button class="btn gray" id="exp">💾 نسخة احتياطية</button><button class="btn gray" id="imp">📂 استرجاع</button>
  <button class="btn gray" id="rl">إعادة الشعارات الأصلية</button><button class="btn red" id="rst">مسح كل شيء</button></div>
  <p style="color:var(--muted);font-size:.85rem">لتغيير أي شعار اضغط عليه مباشرة. بياناتك تُحفظ في هذا المتصفح فقط.</p></div></div>`;
  $('#sv_save').onclick=()=>{S.title=$('#st').value.trim()||S.title;S.sub=$('#ss').value.trim();S.tag=$('#sg').value;S.goal=Math.max(1,parseInt($('#sgl').value)||1200);S.supervisor=$('#sv').value.trim();S.countToGroup=$('#ctg').checked;save();paintFrame();toast('تم الحفظ ✓')};
  $('#rl').onclick=()=>{S.logoR=S.logoL='';save();paintFrame()};
  const bk=()=>{const d=Object.assign({},S,{logoR:'',logoL:''});return JSON.stringify(d)};
  $('#exp').onclick=()=>{dlg('نسخة احتياطية',[{label:'انسخ النص واحفظه في ملف أو رسالة لنفسك',value:bk(),area:true,readonly:true}],'نسخ',()=>{
    try{navigator.clipboard.writeText(bk()).then(()=>toast('تم النسخ ✓'),()=>toast('حدد النص وانسخه يدويًا'))}catch(e){toast('حدد النص وانسخه يدويًا')}})};
  $('#imp').onclick=()=>dlg('استرجاع نسخة',[{label:'الصق النص المحفوظ هنا',value:'',area:true}],'استرجاع',([t])=>{
    try{const d=JSON.parse(t);if(!Array.isArray(d.groups))throw 0;S=Object.assign(fresh(),d);save();boot();toast('تم الاسترجاع ✓')}catch(e){toast('النص غير صالح')}});
  $('#rst').onclick=()=>sure('سيتم حذف كل البيانات نهائيًا. متأكد؟','مسح كل شيء',()=>{S=fresh();save();boot()});
}
$('#hTitle').onclick=$('#hSub').onclick=()=>go('settings');

function boot(){paintFrame();paintMenu();paintAdd();render()}
boot();
</script>
</body>
</html>
